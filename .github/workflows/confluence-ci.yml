name: Confluence CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check lint
        run: npm run lint
      - name: Validate authored rooms
        run: npm run validate:rooms
      - name: Compile production build
        run: npm run build
      - name: Launch preview for visual evidence
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/confluence-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/confluence-preview.log
          exit 1
      - name: Capture WebGL rooms 06–12
        run: node scripts/capture_program_furnishings.mjs
      - name: Preserve screenshots and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confluence-program-rooms
          path: validation/evidence/program-rooms/
          if-no-files-found: warn
